<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konsultasi Wyndstar Training Center</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">
        <img src="https://scontent.fsub2-4.fna.fbcdn.net/v/t39.30808-6/306884389_460679299408956_718037777304063286_n.jpg?stp=dst-jpg_tt6&cstp=mx720x720&ctp=s720x720&_nc_cat=107&_nc_map=urlgen_bucketless&ccb=1-7&_nc_sid=6ee11a&_nc_eui2=AeFLRk5ohi0LoqeURCmCjE4vTtR8XiAuAPVO1HxeIC4A9SHe-H4ig9PiIZKyTtfa9H5cMpqU9uG81WW_ztPagq9f&_nc_ohc=P6AHnrkoS30Q7kNvwE7iVMd&_nc_oc=Ado9ucQnc6bsrEdyv8PGkA4Q3UIsFxd5EK-5e_3nH7jewGi3uj1OmuKoE5V-OTZHpQY&_nc_zt=23&_nc_ht=scontent.fsub2-4.fna&_nc_gid=pqGXGpe6ARPajksaIEZO4A&_nc_ss=7b2a8&oh=00_AQQI2IY_9rKwkxxuskGvqCpM1awD-3yxN-zv9OON9MhDZQ&oe=6AF7475E" alt="Wyndstar Logo" class="logo-img">
        <span>Wyndstar Training Center</span>
      </div>
      <div class="steps">
        <span class="step active">1. Data</span>
        <span class="step">2. Jadwal</span>
        <span class="step">3. Konfirmasi</span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Konsultasi Wyndstar via Google Meet</h1>
      <p>Pilih jadwal, dapat link, langsung gabung dari browser — tanpa perlu install aplikasi.</p>
    </section>

    <form id="formBooking" class="card">
      <h2>Data Diri</h2>

      <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" required placeholder="Budi Santoso">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="budi@email.com">
        <small>Link Google Meet akan dikirim ke email ini.</small>
      </div>

      <div class="form-group">
        <label for="topik">Topik Konsultasi</label>
        <textarea id="topik" required rows="3" placeholder="Contoh: Konsultasi untuk kapal pesiar"></textarea>
      </div>

      <button type="submit" class="btn-primary">Lanjut Pilih Jadwal →</button>
    </form>
  </main>

  <footer><p>© 2026 Wyndstar Training Center · Didukung oleh Google Meet</p></footer>
  <script src="app.js"></script>
</body>
</html>
