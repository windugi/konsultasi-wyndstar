<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konfirmasi Booking - Wyndstar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">
        <img src="https://scontent.fsub2-4.fna.fbcdn.net/v/t39.30808-6/306884389_460679299408956_718037777304063286_n.jpg?stp=dst-jpg_tt6&cstp=mx720x720&ctp=s720x720&_nc_cat=107&_nc_map=urlgen_bucketless&ccb=1-7&_nc_sid=6ee11a&_nc_eui2=AeFLRk5ohi0LoqeURCmCjE4vTtR8XiAuAPVO1HxeIC4A9SHe-H4ig9PiIZKyTtfa9H5cMpqU9uG81WW_ztPagq9f&_nc_ohc=P6AHnrkoS30Q7kNvwE7iVMd&_nc_oc=Ado9ucQnc6bsrEdyv8PGkA4Q3UIsFxd5EK-5e_3nH7jewGi3uj1OmuKoE5V-OTZHpQY&_nc_zt=23&_nc_ht=scontent.fsub2-4.fna&_nc_gid=pqGXGpe6ARPajksaIEZO4A&_nc_ss=7b2a8&oh=00_AQQI2IY_9rKwkxxuskGvqCpM1awD-3yxN-zv9OON9MhDZQ&oe=6AF7475E" alt="Wyndstar Logo" class="logo-img">
        <span>Wyndstar Training Center</span>
      </div>
      <div class="steps">
        <span class="step done">1. Data</span>
        <span class="step done">2. Jadwal</span>
        <span class="step active">3. Konfirmasi</span>
      </div>
    </div>
  </header>

  <main class="container">
    <a href="jadwal.html" class="back-link">← Kembali</a>

    <div class="card">
      <h2>Konfirmasi Booking</h2>

      <div class="ringkasan">
        <div class="ringkasan-row"><span>Nama</span><strong id="rNama">-</strong></div>
        <div class="ringkasan-row"><span>Email</span><strong id="rEmail">-</strong></div>
        <div class="ringkasan-row"><span>Topik</span><strong id="rTopik">-</strong></div>
        <div class="ringkasan-row"><span>Tanggal</span><strong id="rTanggal">-</strong></div>
        <div class="ringkasan-row"><span>Waktu</span><strong id="rJam">-</strong></div>
      </div>

      <label class="checkbox">
        <input type="checkbox" id="setuju">
        <span>Saya setuju menerima email konfirmasi & link Google Meet</span>
      </label>

      <button id="btnSubmit" class="btn-primary" disabled>Konfirmasi Sekarang</button>
    </div>
  </main>

  <footer><p>© 2026 Wyndstar Training Center · Didukung oleh Google Meet</p></footer>
  <script src="app.js"></script>
</body>
</html>
